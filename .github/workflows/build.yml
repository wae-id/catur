name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Stockfish Engine (ARM64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          URL=$(curl -s https://api.github.com/repos/official-stockfish/Stockfish/releases/latest \
            | grep "browser_download_url" \
            | grep "android-armv8.tar" \
            | cut -d '"' -f 4 | head -n 1)
          if [ -z "$URL" ]; then
            echo "Error: URL binary Stockfish tidak ditemukan."
            exit 1
          fi
          curl -L "$URL" -o stockfish.tar
          tar -xf stockfish.tar
          FOUND=$(find . -type f -name "stockfish*armv8*" ! -name "*.tar" | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "Error: File binary hasil ekstrak tidak ditemukan."
            exit 1
          fi
          cp "$FOUND" app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so
          rm -rf stockfish.tar stockfish

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessOverlay-debug
          path: app/build/outputs/apk/debug/*.apk
