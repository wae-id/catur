name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Download Stockfish and NNUE
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/assets
        
        # PAKAI LINK YANG BENER (arm64v8)
        curl -L -o app/src/main/jniLibs/arm64-v8a/libstockfish.so https://github.com/official-stockfish/Stockfish/releases/download/sf_16.1/stockfish-android-arm64v8
        
        FILESIZE=$(stat -c%s app/src/main/jniLibs/arm64-v8a/libstockfish.so)
        echo "Ukuran Stockfish: $FILESIZE bytes"
        if [ "$FILESIZE" -lt 1000000 ]; then
          echo "ERROR: Gagal download Stockfish!"
          exit 1
        fi

        # Download NNUE
        curl -L -o app/src/main/assets/nn-5af11540bbfe.nnue https://tests.stockfishchess.org/api/nn/nn-5af11540bbfe.nnue

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
