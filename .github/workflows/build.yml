name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

    - name: Download NNUE
      run: |
        mkdir -p app/src/main/assets
        curl -L -o app/src/main/assets/nn-5af11540bbfe.nnue https://tests.stockfishchess.org/api/nn/nn-5af11540bbfe.nnue

    - name: Compile Stockfish for Android
      run: |
        # 1. Set path NDK dan Compiler Android secara eksplisit
        export NDK=$ANDROID_HOME/ndk/25.2.9519653
        export TARGET=aarch64-linux-android
        export API=21
        export CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET}${API}-clang
        export CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET}${API}-clang++
        
        # 2. Clone kode sumber
        git clone https://github.com/official-stockfish/Stockfish.git
        cd Stockfish/src
        
        # 3. Kasih tau make untuk pakai CC dan CXX yang udah kita set
        make -j build ARCH=arm64 COMP=ndk CC=$CC CXX=$CXX
        
        # 4. Pindahin ke project
        mkdir -p ../../app/src/main/jniLibs/arm64-v8a
        cp stockfish ../../app/src/main/jniLibs/arm64-v8a/libstockfish.so
        
        echo "Ukuran Stockfish: $(stat -c%s ../../app/src/main/jniLibs/arm64-v8a/libstockfish.so) bytes"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
