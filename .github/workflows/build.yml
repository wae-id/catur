name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Download NNUE
      run: |
        mkdir -p app/src/main/assets
        curl -L -o app/src/main/assets/nn-5af11540bbfe.nnue https://tests.stockfishchess.org/api/nn/nn-5af11540bbfe.nnue

    - name: Compile Stockfish for Android
      run: |
        sudo apt-get install -y make
        # Cari NDK yang terinstal di server GitHub
        NDK_VERSION=$(ls $ANDROID_HOME/ndk | head -n 1)
        export ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION
        echo "Menggunakan NDK: $ANDROID_NDK"
        
        # Clone kode sumber Stockfish
        git clone https://github.com/official-stockfish/Stockfish.git
        cd Stockfish/src
        
        # Compile jadiin binary Android ARM64
        make -j build ARCH=arm64 COMP=ndk
        
        # Pindahin ke folder jniLibs project kita
        mkdir -p ../../app/src/main/jniLibs/arm64-v8a
        cp stockfish ../../app/src/main/jniLibs/arm64-v8a/libstockfish.so
        
        # Cek ukuran file biar mastiin sukses
        echo "Ukuran Stockfish: $(stat -c%s ../../app/src/main/jniLibs/arm64-v8a/libstockfish.so) bytes"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
